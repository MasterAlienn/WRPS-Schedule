<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
    <style>
        * {
            --table-border-width: 2px;
            --color: #fff;
            font-family: Outfit, Arial, Helvetica, sans-serif;
        }
        body {
            margin: 0;
        }
        tbody {
            height: 0;
            width: 0;
            display: inline;
        }
        div {
            height: 90vh;
            max-width: 100%;
            color: var(--color);
        }
        button {
            --width: calc(100% / 8);
            --margin: .5%;
            color: var(--color);
            height: 100%;
            font-size: larger;
            width: var(--width);
            margin-left: var(--margin);
            margin-right: var(--margin);
            background: none;
            border: 2px var(--color) solid;
            overflow: clip;
        }
        img {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        dialog {
            padding: 0;
            border: 0;
            height: fit-content;
            width: fit-content;
            background: #0000;
        }
        dialog::backdrop {
            background-color: #2223;
        }
        .table {
            border: var(--table-border-width) solid var(--color);
            height: 100%;
            width: 100%;
            display: inline;
            overflow-y: scroll;
        }
        .row {
            height: min-content;
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
        }
        .cell {
            display: flex;
            border: none;
            height: 100%;
            width: 10%;
            align-items: center;
            padding-left: 1%;
            padding-right: 1%;
        }
        #button-container {
            height: 9vh;
            text-align: center;
            margin-bottom: 1vh;
        }
        #table-container {
            height: 90vh;
            display: flex;
            margin: auto;
        }
        #Sun-btn {
            margin-left: 0;
        }
        #Sat-btn {
            margin-right: 0;
        }
        .info-container {
            width: 70%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .show {
            width: 100%;
            height: 49%;
            font-size: xx-large;
        }
        .desc {
            width: 100%;
            height: 49%;
            overflow-wrap: break-word;
            
        }
        .img-cell {
            height: 100%;
            width: 20%;
            align-items: center;
        }
        .timestamp {
            height: 100%;
            width: 10%;
            text-align: center;
            font-size: x-large;
            display: inline;
        }
        .border {
            border-top: var(--table-border-width) solid var(--color);
            height: 0;
            width: 100%;
        }
        button:hover {
            background-color: #4441;
            cursor: pointer;
        }
        button.selected {
            background-color: #fff3;
        }
        @font-face {
            font-family: Outfit;
            src: url("https://masteralienn.github.io/WRPS-Schedule/assets/QGYvz_MVcBeNP4NJtEtqUYLknw.woff2");
        }
        @media (max-width: 900px) {
            html {
                border: 3px solid var(--color);
            }
            .img-cell {
                max-width: 70%;
            }
            #button-container {
                display: flex;
                flex-direction: column;
                height: min-content;
                margin: 0;
                border: 0;
            }
            #button-container > button {
                width: 100%;
                margin: auto;
                border: 0;
                border-bottom: var(--table-border-width) solid var(--color);
            }
            #table-container {
                height: auto;
            }
            .table {
                border: 0;
            }
            .row {
                flex-direction: column;
            }
            .row .cell {
                text-align: center;
                width: max-content;
            }
        }
    </style>
</head>
<body>
    <div id="button-container">
        <button id="Sun-btn" class="selected">Sunday</button>
        <button id="Mon-btn" class="">Monday</button>
        <button id="Tue-btn" class="">Tuesday</button>
        <button id="Wed-btn" class="">Wednesday</button>
        <button id="Thu-btn" class="">Thursday</button>
        <button id="Fri-btn" class="">Friday</button>
        <button id="Sat-btn" class="">Saturday</button>
    </div>
    <div id="table-container">
    <!-- make it dynamically build for easy edits -->
    <table class="table" id="Sun"></table>
    <table class="table" id="Mon" style="display: none;"></table>
    <table class="table" id="Tue" style="display: none;"></table>
    <table class="table" id="Wed" style="display: none;"></table>
    <table class="table" id="Thu" style="display: none;"></table>
    <table class="table" id="Fri" style="display: none;"></table>
    <table class="table" id="Sat" style="display: none;"></table>
    </div>
    <dialog><img draggable="false"/></dialog>
    <script type="module">
        let dayTbls = document.querySelectorAll("table");
        let dayBtns = document.getElementsByTagName("button");
        let dialog = document.querySelector("dialog");
        let shows = await fetch("/schedule.json").then(res => {
            if (!res.ok) {
                throw new Error("Response not ok");
                return;
            }
            return res.json();
        }).then(data => {
            return data;
        }).catch(err => {
            console.error(err);
        });
        // init
        for (let i = 0; i < 7; i++) {
            // show correct div when button clicked
            dayBtns[i].addEventListener("click", () => {
                dayTbls[i].style.display = "inline";
                dayBtns[i].classList.add("selected");
                for (let j = 0; j < 7; j++) {
                    if (i != j) {
                        dayTbls[j].style.display = "none";
                        dayBtns[j].classList.remove("selected");
                    }
                }
            });
            // gets show info from shows var, add to div
            switch (i) {
                case 0:
                    for (let j = 0; j < shows.sun.length; j++) {
                        dayTbls[i].innerHTML += `<tr class="row"><td class="cell timestamp">${shows.sun[j].time}</td><td class="info-container"><div class="cell show">${shows.sun[j].show}</div><div class="cell desc">${shows.sun[j].description}</div></td><td class="cell img-cell"><img src="${shows.sun[j].imgUrl}" draggable="false"/></td></tr><div class="border"></div>`;
                    }
                    break;
                case 1:
                    for (let j = 0; j < shows.mon.length; j++) {
                        dayTbls[i].innerHTML += `<tr class="row"><td class="cell timestamp">${shows.mon[j].time}</td><td class="info-container"><div class="cell show">${shows.mon[j].show}</div><div class="cell desc">${shows.mon[j].description}</div></td><td class="cell img-cell"><img src="${shows.mon[j].imgUrl}" draggable="false"/></td></tr><div class="border"></div>`;
                    }
                    break;
                case 2:
                    for (let j = 0; j < shows.tue.length; j++) {
                        dayTbls[i].innerHTML += `<tr class="row"><td class="cell timestamp">${shows.tue[j].time}</td><td class="info-container"><div class="cell show">${shows.tue[j].show}</div><div class="cell desc">${shows.tue[j].description}</div></td><td class="cell img-cell"><img src="${shows.tue[j].imgUrl}" draggable="false"/></td></tr><div class="border"></div>`;
                    }
                    break;
                case 3:
                    for (let j = 0; j < shows.wed.length; j++) {
                        dayTbls[i].innerHTML += `<tr class="row"><td class="cell timestamp">${shows.wed[j].time}</td><td class="info-container"><div class="cell show">${shows.wed[j].show}</div><div class="cell desc">${shows.wed[j].description}</div></td><td class="cell img-cell"><img src="${shows.wed[j].imgUrl}" draggable="false"/></td></tr><div class="border"></div>`;
                    }
                    break;
                case 4:
                    for (let j = 0; j < shows.thu.length; j++) {
                        dayTbls[i].innerHTML += `<tr class="row"><td class="cell timestamp">${shows.thu[j].time}</td><td class="info-container"><div class="cell show">${shows.thu[j].show}</div><div class="cell desc">${shows.thu[j].description}</div></td><td class="cell img-cell"><img src="${shows.thu[j].imgUrl}" draggable="false"/></td></tr><div class="border"></div>`;
                    }
                    break;
                case 5:
                    for (let j = 0; j < shows.fri.length; j++) {
                        dayTbls[i].innerHTML += `<tr class="row"><td class="cell timestamp">${shows.fri[j].time}</td><td class="info-container"><div class="cell show">${shows.fri[j].show}</div><div class="cell desc">${shows.fri[j].description}</div></td><td class="cell img-cell"><img src="${shows.fri[j].imgUrl}" draggable="false"/></td></tr><div class="border"></div>`;
                    }
                    break;
                case 6:
                    for (let j = 0; j < shows.sat.length; j++) {
                        dayTbls[i].innerHTML += `<tr class="row"><td class="cell timestamp">${shows.sat[j].time}</td><td class="info-container"><div class="cell show">${shows.sat[j].show}</div><div class="cell desc">${shows.sat[j].description}</div></td><td class="cell img-cell"><img src="${shows.sat[j].imgUrl}" draggable="false"/></td></tr><div class="border"></div>`;
                    }
                    break;
            }
        }
        let imgs = document.querySelectorAll("img");
        for (let i = 0; i < imgs.length - 1; i++) {
            imgs[i].addEventListener("click", () => {
                imgs[imgs.length - 1].src = imgs[i].src;
                dialog.showModal();
            });
        }
        dialog.addEventListener("click", () => {
            dialog.close();
        });
    </script>
</body>
</html>
