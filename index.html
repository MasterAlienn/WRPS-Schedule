  <style>
    * {
        --table-border-width: 2px;
    }
    body {
        margin: 0;
    }
    tbody {
        height: 0;
        width: 0;
        display: inline;
    }
    div {
        height: 90vh;
        max-width: 100%;
    }
    button {
        --width: calc(100% / 8);
        --margin: .5%;
        --color: #222;
        color: var(--color);
        height: 100%;
        font-size: 100%;
        font-family: Outfit, Arial, Helvetica, sans-serif;
        width: var(--width);
        margin-left: var(--margin);
        margin-right: var(--margin);
        background: none;
        border: 2px var(--color) solid;
    }
    .table {
        border: var(--table-border-width) solid black;
        height: 100%;
        width: 100%;
    }
    .row {
        border-bottom: var(--table-border-width) solid black;
        height: 14.2857142857%;
        width: 100%;
        display: flex;
        flex-direction: row;
    }
    .cell {
        display: flex;
        border: none;
        height: 100%;
        width: 10%;
        align-items: center;
        padding-left: 1%;
        padding-right: 1%;
    }
    #button-container {
        height: 9vh;
        text-align: center;
        margin-bottom: 1vh;
    }
    #table-container {
        width: calc(100% - (var(--table-border-width) * 2));
        display: flex;
        margin: auto;
    }
    #Sun-btn {
        margin-left: 0;
    }
    #Sat-btn {
        margin-right: 0;
    }
    .info-container {
        width: 90%;
    }
    .show {
        width: 90%;
        text-align: right;
    }
    .desc {

    }
    .img-cell {
        width: 10%;
        /* add another container so image can be to the right */
    }
    button:hover {
        background-color: #4441;
        cursor: pointer;
    }
    button.selected {
        background-color: #4445;
    }
    @font-face {
        font-family: Outfit;
        src: url("https://fonts.gstatic.com/s/outfit/v15/QGYvz_MVcBeNP4NJtEtqUYLknw.woff2");
    }
  </style>
</head>
